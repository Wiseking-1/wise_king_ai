<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wise King AI</title>
    <style>
      :root {
        --bg: #0a0a0f;
        --bg2: #111118;
        --panel: #171821;
        --panel-2: #1d1d29;
        --border: rgba(255,255,255,0.08);
        --text: #f5f5f7;
        --muted: #a1a1aa;
        --accent: #6366f1;
        --accent-2: #8b5cf6;
        --success: #10b981;
        --danger: #ef4444;
        --shadow: rgba(0,0,0,0.45);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        font-family: Inter, system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      body {
        display: flex;
        justify-content: center;
        align-items: stretch;
      }

      .app {
        width: min(1100px, 100%);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: linear-gradient(180deg, rgba(15,15,20,0.95), rgba(10,10,15,1));
      }

      .topbar {
        height: 72px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 22px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .brand-mark {
        width: 34px;
        height: 34px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        box-shadow: 0 12px 30px rgba(99,102,241,0.4);
      }

      .status {
        color: var(--muted);
        font-size: 13px;
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(255,255,255,0.02);
        border: 1px solid var(--border);
        padding: 8px 12px;
        border-radius: 999px;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--success);
        box-shadow: 0 0 10px rgba(16,185,129,0.7);
      }

      .chat-area {
        flex: 1;
        overflow-y: auto;
        padding: 28px 20px 160px;
      }

      .messages {
        width: min(820px, 100%);
        margin: 0 auto;
      }

      .message {
        display: flex;
        gap: 14px;
        margin-bottom: 18px;
        animation: fadeIn 0.25s ease;
      }

      .avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-weight: 700;
        flex-shrink: 0;
      }

      .avatar.user {
        background: rgba(255,255,255,0.08);
        color: var(--text);
      }

      .avatar.ai {
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: white;
      }

      .bubble {
        flex: 1;
        background: rgba(255,255,255,0.02);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 14px 16px;
        line-height: 1.7;
        white-space: pre-wrap;
        word-wrap: break-word;
      }

      .bubble.user {
        background: linear-gradient(135deg, rgba(99,102,241,0.2), rgba(139,92,246,0.2));
      }

      .bubble.ai {
        background: rgba(255,255,255,0.02);
      }

      .composer-wrap {
        position: fixed;
        left: 50%;
        bottom: 0;
        transform: translateX(-50%);
        width: min(980px, calc(100% - 28px));
        padding: 18px 18px 22px;
        background: linear-gradient(180deg, rgba(10,10,15,0), rgba(10,10,15,0.92) 20%, rgba(10,10,15,1) 100%);
      }

      .composer {
        background: rgba(22, 22, 31, 0.96);
        border: 1px solid var(--border);
        border-radius: 22px;
        box-shadow: 0 30px 80px rgba(0,0,0,0.45);
        padding: 10px 12px 12px;
      }

      .row {
        display: flex;
        align-items: flex-end;
        gap: 10px;
      }

      textarea {
        flex: 1;
        border: none;
        resize: none;
        outline: none;
        background: transparent;
        color: var(--text);
        font-size: 16px;
        line-height: 1.6;
        min-height: 52px;
        max-height: 220px;
        padding: 10px 4px 8px;
        font-family: inherit;
      }

      textarea::placeholder {
        color: var(--muted);
      }

      .send-btn {
        width: 46px;
        height: 46px;
        border: none;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: white;
        font-size: 18px;
        cursor: pointer;
        box-shadow: 0 10px 20px rgba(99,102,241,0.35);
      }

      .send-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .chip-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 4px 0 2px;
        margin-top: 8px;
      }

      .chip {
        border: 1px solid var(--border);
        background: rgba(255,255,255,0.02);
        color: var(--muted);
        border-radius: 999px;
        padding: 7px 12px;
        cursor: pointer;
        font-size: 12px;
      }

      .chip.active {
        color: white;
        background: rgba(99,102,241,0.18);
        border-color: rgba(99,102,241,0.5);
      }

      .hint {
        color: var(--muted);
        text-align: center;
        font-size: 12px;
        margin-top: 12px;
      }

      .loader {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        display: inline-block;
        animation: pulse 1.2s infinite ease-in-out;
      }

      .dot:nth-child(2) { animation-delay: .15s; }
      .dot:nth-child(3) { animation-delay: .3s; }

      @keyframes pulse {
        0%, 80%, 100% { transform: scale(0.7); opacity: 0.5; }
        40% { transform: scale(1); opacity: 1; }
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @media (max-width: 720px) {
        .topbar {
          padding: 0 16px;
        }

        .brand span {
          font-size: 14px;
        }

        .status {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">👑</div>
          <span>Wise King AI</span>
        </div>
        <div class="status"><span class="status-dot"></span> Connected to local API</div>
      </header>

      <main class="chat-area">
        <div class="messages" id="messages"></div>
      </main>

      <div class="composer-wrap">
        <div class="composer">
          <div class="row">
            <textarea id="prompt" rows="1" placeholder="Ask Wise King AI anything..."></textarea>
            <button id="sendButton" class="send-btn" aria-label="Send">↑</button>
          </div>

          <div class="chip-row">
            <button class="chip active" type="button">Think</button>
            <button class="chip" type="button">Search</button>
            <button class="chip" type="button">Code</button>
          </div>
        </div>
        <div class="hint">Demo mode is active until OpenAI key is added in the backend .env file.</div>
      </div>
    </div>

    <script>
      const messagesEl = document.getElementById('messages');
      const promptEl = document.getElementById('prompt');
      const sendButton = document.getElementById('sendButton');
      let isSending = false;

      function addMessage(role, text) {
        const wrapper = document.createElement('div');
        wrapper.className = 'message';

        const avatar = document.createElement('div');
        avatar.className = `avatar ${role}`;
        avatar.textContent = role === 'user' ? 'U' : 'AI';

        const bubble = document.createElement('div');
        bubble.className = `bubble ${role}`;
        bubble.textContent = text;

        wrapper.appendChild(avatar);
        wrapper.appendChild(bubble);
        messagesEl.appendChild(wrapper);
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      }

      function addTypingIndicator() {
        const wrapper = document.createElement('div');
        wrapper.className = 'message';
        wrapper.id = 'typing-indicator';

        const avatar = document.createElement('div');
        avatar.className = 'avatar ai';
        avatar.textContent = 'AI';

        const bubble = document.createElement('div');
        bubble.className = 'bubble ai';
        bubble.innerHTML = '<span class="loader"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>';

        wrapper.appendChild(avatar);
        wrapper.appendChild(bubble);
        messagesEl.appendChild(wrapper);
      }

      function removeTypingIndicator() {
        const indicator = document.getElementById('typing-indicator');
        if (indicator) indicator.remove();
      }

      async function sendToBackend(prompt) {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: prompt,
            systemPrompt: 'You are Wise King AI, a helpful, friendly assistant.'
          })
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || 'Request failed');
        }

        return data.reply;
      }

      async function handleSend() {
        const prompt = promptEl.value.trim();
        if (!prompt || isSending) return;

        isSending = true;
        sendButton.disabled = true;
        addMessage('user', prompt);
        promptEl.value = '';
        promptEl.style.height = '52px';
        addTypingIndicator();

        try {
          const reply = await sendToBackend(prompt);
          removeTypingIndicator();
          addMessage('ai', reply);
        } catch (error) {
          removeTypingIndicator();
          addMessage('ai', `There was a problem connecting to the backend.\n\n${error.message}\n\nMake sure the server is running and your .env file is configured.`);
        } finally {
          isSending = false;
          sendButton.disabled = false;
          promptEl.focus();
        }
      }

      promptEl.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          handleSend();
        }
      });

      sendButton.addEventListener('click', handleSend);

      promptEl.addEventListener('input', () => {
        const lineHeight = 24;
        const lines = Math.min(6, Math.max(1, Math.ceil(promptEl.scrollHeight / lineHeight)));
        promptEl.rows = lines;
      });

      addMessage('ai', 'Welcome to Wise King AI. Ask me anything and I will route it through the backend API.');
    </script>
  </body>
</html>
